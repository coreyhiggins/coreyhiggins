<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Corey Higgins, founder and head of engineering at Wynfall Studios">
  <defs>
    <radialGradient id="glow" cx="18%" cy="12%" r="72%">
      <stop offset="0%" stop-color="#5fe8ff" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#5fe8ff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#5fe8ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#5fe8ff" fill-opacity="0.13"/>
    </pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5fe8ff" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#5fe8ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5fe8ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#06090a"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect x="700" y="0" width="500" height="300" fill="url(#dots)"/>

  <g stroke="#5fe8ff" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M1010 216 A 96 96 0 0 1 1106 120" stroke-width="1.6" opacity="0.55"/>
    <path d="M983 216 A 123 123 0 0 1 1106 93" stroke-width="1.2" opacity="0.34"/>
    <path d="M956 216 A 150 150 0 0 1 1106 66" stroke-width="1" opacity="0.2"/>
    <path d="M929 216 A 177 177 0 0 1 1106 39" stroke-width="0.8" opacity="0.12"/>
  </g>
  <circle cx="1106" cy="216" r="3.4" fill="#5fe8ff"/>
  <line x1="1010" y1="216" x2="1106" y2="216" stroke="#5fe8ff" stroke-width="1" opacity="0.25"/>

  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="108" fill="#5fe8ff" font-size="13.5" font-weight="600" letter-spacing="5.4" opacity="0.92">WYNFALL STUDIOS</text>
    <text x="72" y="178" fill="#f7fafb" font-size="60" font-weight="600" letter-spacing="-1.2">Corey Higgins</text>
    <text x="73" y="219" fill="#93a1a8" font-size="19.5" font-weight="400" letter-spacing="0.2">Founder and head of engineering</text>
  </g>

  <rect x="72" y="248" width="216" height="2.5" fill="url(#rule)"/>
</svg>
